<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactico — スコアゼロの欧州サッカー戦術ノート</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            base: '#0b1912',
                            line: '#1e4b35',
                            accent: '#10b981',
                            highlight: '#34d399',
                            dark: '#060d09'
                        },
                        slate: {
                            850: '#131b2e',
                            900: '#0f172a',
                            950: '#080d1a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080d1a;
            color: #f1f5f9;
        }
        .pitch-grid {
            background-image: linear-gradient(to right, rgba(30, 75, 53, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(30, 75, 53, 0.2) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .pitch-bg {
            background: radial-gradient(circle at center, #0e2319 0%, #060d09 100%);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080d1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">

    <header class="h-16 border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md px-6 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner">
                <i class="fa-solid fa-chess-board text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-100 tracking-tight flex items-center gap-2 text-lg">
                    TACTICO
                    <span class="text-[10px] font-mono font-semibold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase">
                        Zero Spoilers
                    </span>
                </h1>
                <p class="text-[11px] text-slate-400 font-mono hidden sm:block">結果のノイズを完全に遮断した、純粋な戦術観戦ノート</p>
            </div>
        </div>

        <nav class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
            <button id="navMatchesBtn" onclick="switchTab('matches')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 bg-emerald-500 text-slate-950 shadow-sm">
                <i class="fa-regular fa-calendar-days"></i> 試合カード
            </button>
            <button id="navBoardBtn" onclick="switchTab('board')" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all flex items-center gap-2">
                <i class="fa-solid fa-vector-square"></i> 戦術ピッチ
            </button>
            <button id="navLogsBtn" onclick="switchTab('logs')" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all flex items-center gap-2">
                <i class="fa-regular fa-file-lines"></i> 考察ログ
            </button>
        </nav>

        <div class="flex items-center gap-2">
            <button onclick="fetchLatestMatches()" title="APIから最新試合を同期" class="px-3 py-1.5 bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/30 text-sky-400 text-xs rounded-lg transition-all flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-rotate"></i> 試合同期
            </button>
            <button onclick="openModal('apiModal')" title="API設定" class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded-lg transition-all text-xs">
                <i class="fa-solid fa-key"></i>
            </button>
            <button onclick="openModal('newMatchModal')" class="px-3.5 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-xs rounded-lg transition-all flex items-center gap-2 font-medium">
                <i class="fa-solid fa-plus"></i> 新規カード
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">

        <!-- VIEW 1: MATCH FIXTURES LIST -->
        <section id="viewMatches" class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
            
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-b border-slate-800/80 pb-5">
                <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-2 sm:pb-0">
                    <span class="text-xs font-mono text-slate-500 uppercase tracking-wider shrink-0">Filter:</span>
                    <button onclick="filterLeague('all')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 shrink-0">
                        すべて
                    </button>
                    <button onclick="filterLeague('PL')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Premier League
                    </button>
                    <button onclick="filterLeague('PD')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        La Liga
                    </button>
                    <button onclick="filterLeague('SA')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Serie A
                    </button>
                    <button onclick="filterLeague('BL1')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Bundesliga
                    </button>
                    <button onclick="filterLeague('FL1')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Ligue 1
                    </button>
                    <button onclick="filterLeague('CL')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        UCL
                    </button>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <div class="relative w-full sm:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                        <input type="text" id="matchSearchInput" oninput="renderMatches()" placeholder="クラブ名で検索..." class="bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 w-full">
                    </div>
                </div>
            </div>

            <div id="matchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <div id="matchesEmpty" class="hidden flex-1 flex flex-col items-center justify-center text-center p-12 text-slate-500">
                <i class="fa-regular fa-futbol text-4xl mb-3 text-slate-700"></i>
                <p class="text-sm font-medium text-slate-400">試合カードがありません</p>
                <p class="text-xs text-slate-600 mt-1 max-w-sm">右上キーマークからAPIキーを設定後、「試合同期」を押すと5大リーグの最新試合が読み込まれます。</p>
            </div>
        </section>

        <!-- VIEW 2: TACTICAL PITCH BOARD -->
        <section id="viewBoard" class="hidden flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-950">
            <div class="flex-1 relative pitch-bg pitch-grid flex items-center justify-center p-4 overflow-hidden select-none">
                <svg id="pitchMarkingsSvg" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] pointer-events-none" viewBox="0 0 800 500" preserveAspectRatio="none">
                    <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <line x1="400" y1="20" x2="400" y2="480" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <circle cx="400" cy="250" r="65" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <circle cx="400" cy="250" r="3" fill="#1e4b35"/>
                    <rect x="20" y="115" width="120" height="270" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <rect x="20" y="185" width="40" height="130" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <rect x="660" y="115" width="120" height="270" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <rect x="740" y="185" width="40" height="130" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                </svg>

                <canvas id="pitchCanvas" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] cursor-crosshair z-10"></canvas>
                <div id="playersOverlay" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] z-20 pointer-events-none"></div>

                <div class="absolute bottom-6 left-6 z-30 flex items-center gap-2 bg-slate-900/90 border border-slate-800 p-2 rounded-xl backdrop-blur-md shadow-2xl">
                    <button onclick="setDrawTool('arrow')" id="toolArrowBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-emerald-500 text-slate-950 shadow">
                        <i class="fa-solid fa-arrow-right"></i> 移動矢印
                    </button>
                    <button onclick="setDrawTool('pass')" id="toolPassBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                        <i class="fa-solid fa-ellipsis"></i> パス（点線）
                    </button>
                    <div class="w-px h-4 bg-slate-800 my-auto"></div>
                    <button onclick="clearCanvasLines()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition-all">
                        <i class="fa-solid fa-eraser"></i> 線を消去
                    </button>
                </div>
            </div>

            <div class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-slate-800 bg-slate-900/90 p-5 flex flex-col gap-5 shrink-0 overflow-y-auto">
                <div>
                    <span class="text-[10px] font-mono uppercase tracking-wider text-emerald-400">Board Setup</span>
                    <h2 class="text-sm font-semibold text-slate-200">フォーメーション & 作戦配置</h2>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-400">対象の試合カードを選択</label>
                    <select id="boardMatchSelect" onchange="onBoardMatchSelectChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                        <option value="">-- 単体ボードとして使用 --</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-400">表示チーム配置</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="sideHomeBtn" onclick="setBoardTeamSide('home')" class="p-2 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-medium text-center">
                            HOME (左攻撃)
                        </button>
                        <button id="sideAwayBtn" onclick="setBoardTeamSide('away')" class="p-2 rounded-lg bg-slate-950 text-slate-400 border border-slate-800 text-xs font-medium text-center">
                            AWAY (右攻撃)
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-medium text-slate-400">フォーメーション</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyFormationPreset('4-3-3')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">4-3-3</button>
                        <button onclick="applyFormationPreset('4-2-3-1')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">4-2-3-1</button>
                        <button onclick="applyFormationPreset('3-4-2-1')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">3-4-2-1</button>
                        <button onclick="applyFormationPreset('3-5-2')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">3-5-2</button>
                        <button onclick="applyFormationPreset('4-4-2')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">4-4-2</button>
                        <button onclick="applyFormationPreset('5-4-1')" class="p-2 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 font-mono text-center">5-4-1</button>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800">
                    <button onclick="saveCurrentBoardToMatch()" class="w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg text-xs transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> この配置・線を保存
                    </button>
                </div>
            </div>
        </section>

        <!-- VIEW 3: OBSERVATION LOGS -->
        <section id="viewLogs" class="hidden flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
            <div id="logEditor" class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-4 gap-2">
                    <div>
                        <span id="logLeagueTag" class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">対象カード未選択</span>
                        <h3 id="logTitle" class="text-xl font-bold text-slate-100 mt-1">試合カードを選択してください</h3>
                        <p id="logSubtext" class="text-xs text-slate-500 font-mono">---</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-emerald-400"></i> ビルドアップ & プレス回避</label>
                        <textarea id="logBuildUp" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i class="fa-solid fa-chess-rook text-emerald-400"></i> 守備ブロック & 撤退構造</label>
                        <textarea id="logDefensive" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i class="fa-solid fa-user-gear text-emerald-400"></i> 個のタスク・キーマン</label>
                        <textarea id="logPlayers" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2"><i class="fa-solid fa-lightbulb text-emerald-400"></i> 総合戦術総括</label>
                        <textarea id="logSummary" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>
                </div>

                <div class="flex justify-end border-t border-slate-800 pt-4">
                    <button onclick="saveActiveMatchLog()" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg text-xs shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-check"></i> 考察ログを保存
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL: API Key Setting -->
    <div id="apiModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-key text-sky-400"></i> Football-Data.org API設定
                </h3>
                <button onclick="closeModal('apiModal')" class="text-slate-500 hover:text-slate-300 text-xs"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-slate-400">API Token (Key)</label>
                <input type="password" id="apiKeyInput" placeholder="取得したAPIキーを貼り付け" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                <p class="text-[11px] text-slate-500 leading-relaxed">
                    football-data.org で無料登録して取得したトークンを入力してください。ブラウザ内に安全に保存されます。
                </p>
            </div>
            <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
                <button onclick="closeModal('apiModal')" class="px-3 py-1.5 text-xs text-slate-400">キャンセル</button>
                <button onclick="saveApiKey()" class="px-4 py-1.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs rounded-lg">保存する</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Create New Match -->
    <div id="newMatchModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-100"><i class="fa-regular fa-calendar-plus text-emerald-400"></i> 手動カード追加</h3>
                <button onclick="closeModal('newMatchModal')" class="text-slate-500 hover:text-slate-300 text-xs"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="newMatchForm" onsubmit="handleNewMatchSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="inputHome" required placeholder="ホームチーム" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                    <input type="text" id="inputAway" required placeholder="アウェイチーム" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="date" id="inputDate" required class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                    <input type="time" id="inputTime" required class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                </div>
                <select id="inputLeague" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200">
                    <option value="PL">Premier League</option>
                    <option value="PD">La Liga</option>
                    <option value="SA">Serie A</option>
                    <option value="BL1">Bundesliga</option>
                    <option value="FL1">Ligue 1</option>
                    <option value="CL">UEFA Champions League</option>
                </select>
                <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('newMatchModal')" class="px-3 py-1.5 text-xs text-slate-400">キャンセル</button>
                    <button type="submit" class="px-4 py-1.5 bg-emerald-500 text-slate-950 font-semibold text-xs rounded-lg">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let matches = [];
        let activeMatchId = null;
        let activeLeagueFilter = 'all';
        let apiKey = localStorage.getItem('tactico_api_key') || '';

        let currentDrawTool = 'arrow';
        let isDrawing = false;
        let startX = 0, startY = 0;
        let canvasLines = [];
        let selectedBoardSide = 'home';

        const formations = {
            '4-3-3': [{id:1,name:'GK',x:8,y:50},{id:2,name:'RB',x:28,y:18},{id:3,name:'CB',x:22,y:38},{id:4,name:'CB',x:22,y:62},{id:5,name:'LB',x:28,y:82},{id:6,name:'DM',x:42,y:50},{id:7,name:'CM',x:55,y:32},{id:8,name:'CM',x:55,y:68},{id:9,name:'RW',x:78,y:20},{id:10,name:'ST',x:84,y:50},{id:11,name:'LW',x:78,y:80}],
            '4-2-3-1': [{id:1,name:'GK',x:8,y:50},{id:2,name:'RB',x:28,y:18},{id:3,name:'CB',x:22,y:38},{id:4,name:'CB',x:22,y:62},{id:5,name:'LB',x:28,y:82},{id:6,name:'DM',x:40,y:35},{id:7,name:'DM',x:40,y:65},{id:8,name:'RAM',x:65,y:22},{id:9,name:'CAM',x:68,y:50},{id:10,name:'LAM',x:65,y:78},{id:11,name:'ST',x:84,y:50}]
        };

        let currentPlayers = JSON.parse(JSON.stringify(formations['4-3-3']));

        window.onload = function() {
            loadLocalData();
            initPitchCanvas();
            renderMatches();
            updateBoardMatchDropdown();
            if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
        };

        function loadLocalData() {
            const data = localStorage.getItem('tactico_matches_data');
            if (data) matches = JSON.parse(data);
        }

        function saveLocalData() {
            localStorage.setItem('tactico_matches_data', JSON.stringify(matches));
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('tactico_api_key', apiKey);
            closeModal('apiModal');
            alert('APIキーを保存しました。「試合同期」ボタンを押して試合データを取得してください。');
        }

        async function fetchLatestMatches() {
            if (!apiKey) {
                openModal('apiModal');
                return;
            }

            const leagues = ['PL', 'PD', 'SA', 'BL1', 'FL1', 'CL'];
            let newFetched = 0;

            for (const code of leagues) {
                try {
                    const res = await fetch(`https://api.football-data.org/v4/competitions/${code}/matches?status=SCHEDULED,LIVE,FINISHED`, {
                        headers: { 'X-Auth-Token': apiKey }
                    });
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    if (data.matches) {
                        data.matches.slice(0, 10).forEach(m => {
                            if (!matches.some(existing => existing.id === `api_${m.id}`)) {
                                matches.unshift({
                                    id: `api_${m.id}`,
                                    home: m.homeTeam.shortName || m.homeTeam.name,
                                    away: m.awayTeam.shortName || m.awayTeam.name,
                                    date: m.utcDate.slice(0, 10),
                                    time: m.utcDate.slice(11, 16),
                                    league: code,
                                    channel: 'API取得',
                                    buildUp: '', defensive: '', players: '', summary: '', lines: []
                                });
                                newFetched++;
                            }
                        });
                    }
                } catch (e) {
                    console.error('API Error:', e);
                }
            }

            saveLocalData();
            renderMatches();
            updateBoardMatchDropdown();
            alert(`${newFetched} 件の新しい試合情報を同期しました！`);
        }

        function switchTab(tab) {
            document.getElementById('viewMatches').classList.add('hidden');
            document.getElementById('viewBoard').classList.add('hidden');
            document.getElementById('viewLogs').classList.add('hidden');

            if (tab === 'matches') document.getElementById('viewMatches').classList.remove('hidden');
            if (tab === 'board') { document.getElementById('viewBoard').classList.remove('hidden'); resizePitchCanvas(); }
            if (tab === 'logs') document.getElementById('viewLogs').classList.remove('hidden');
        }

        function renderMatches() {
            const grid = document.getElementById('matchesGrid');
            const empty = document.getElementById('matchesEmpty');
            const search = document.getElementById('matchSearchInput').value.toLowerCase();

            grid.innerHTML = '';
            const filtered = matches.filter(m => {
                const matchesLeague = activeLeagueFilter === 'all' || m.league === activeLeagueFilter;
                const matchesSearch = m.home.toLowerCase().includes(search) || m.away.toLowerCase().includes(search);
                return matchesLeague && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden'); empty.classList.remove('hidden'); return;
            }

            grid.classList.remove('hidden'); empty.classList.add('hidden');
            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between";
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-950 text-slate-400 border border-slate-800">${m.league}</span>
                            <span class="text-[10px] font-mono text-emerald-400 border border-emerald-500/20 bg-emerald-500/10 px-2 py-0.5 rounded"><i class="fa-solid fa-eye-slash"></i> スコア非表示</span>
                        </div>
                        <div class="py-3 border-y border-slate-800/80 flex items-center justify-between font-bold text-slate-100 text-base">
                            <div>${m.home}</div><div class="text-xs text-slate-500">VS</div><div>${m.away}</div>
                        </div>
                        <div class="text-xs text-slate-400 font-mono"><i class="fa-regular fa-clock text-emerald-400"></i> ${m.date} ${m.time}</div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-800 flex items-center gap-2 justify-end">
                        <button onclick="openBoardForMatch('${m.id}')" class="px-3 py-1.5 rounded-lg bg-slate-950 text-slate-300 text-xs border border-slate-800"><i class="fa-solid fa-chess-board text-emerald-400"></i> 配置</button>
                        <button onclick="openLogForMatch('${m.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 text-xs border border-emerald-500/20"><i class="fa-regular fa-pen-to-square"></i> 考察</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterLeague(league) {
            activeLeagueFilter = league;
            renderMatches();
        }

        function initPitchCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            window.addEventListener('resize', resizePitchCanvas);
            canvas.addEventListener('mousedown', (e) => { isDrawing = true; const r = canvas.getBoundingClientRect(); startX = e.clientX - r.left; startY = e.clientY - r.top; });
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                const r = canvas.getBoundingClientRect();
                redrawCanvas();
                const ctx = canvas.getContext('2d');
                ctx.beginPath(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5;
                if (currentDrawTool === 'pass') ctx.setLineDash([6, 6]); else ctx.setLineDash([]);
                ctx.moveTo(startX, startY); ctx.lineTo(e.clientX - r.left, e.clientY - r.top); ctx.stroke();
            });
            canvas.addEventListener('mouseup', (e) => {
                if (!isDrawing) return; isDrawing = false;
                const r = canvas.getBoundingClientRect();
                canvasLines.push({ x1: startX, y1: startY, x2: e.clientX - r.left, y2: e.clientY - r.top, tool: currentDrawTool });
                redrawCanvas();
            });
        }

        function resizePitchCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            if (!canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight;
            redrawCanvas();
        }

        function setDrawTool(t) { currentDrawTool = t; }
        function clearCanvasLines() { canvasLines = []; redrawCanvas(); }
        function redrawCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvasLines.forEach(l => {
                ctx.beginPath(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.5;
                if (l.tool === 'pass') ctx.setLineDash([6, 6]); else ctx.setLineDash([]);
                ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            });
        }

        function applyFormationPreset(key) { if (formations[key]) { currentPlayers = JSON.parse(JSON.stringify(formations[key])); renderPlayerOverlayNodes(); } }
        function setBoardTeamSide(s) { selectedBoardSide = s; renderPlayerOverlayNodes(); }
        function renderPlayerOverlayNodes() {
            const c = document.getElementById('playersOverlay'); c.innerHTML = '';
            currentPlayers.forEach(p => {
                const n = document.createElement('div');
                n.className = "absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center";
                n.style.left = `${selectedBoardSide === 'away' ? (100 - p.x) : p.x}%`; n.style.top = `${p.y}%`;
                n.innerHTML = `<div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-emerald-400 text-emerald-300 font-mono text-xs font-bold flex items-center justify-center">${p.id}</div>`;
                c.appendChild(n);
            });
        }

        function updateBoardMatchDropdown() {
            const select = document.getElementById('boardMatchSelect');
            select.innerHTML = '<option value="">-- 単体ボードとして使用 --</option>';
            matches.forEach(m => {
                const opt = document.createElement('option'); opt.value = m.id; opt.textContent = `${m.home} vs ${m.away} (${m.date})`;
                select.appendChild(opt);
            });
        }

        function openBoardForMatch(id) { activeMatchId = id; document.getElementById('boardMatchSelect').value = id; switchTab('board'); }
        function onBoardMatchSelectChange() {
            activeMatchId = document.getElementById('boardMatchSelect').value;
            const match = matches.find(m => m.id === activeMatchId);
            canvasLines = (match && match.lines) ? [...match.lines] : []; redrawCanvas();
        }

        function saveCurrentBoardToMatch() {
            const match = matches.find(m => m.id === document.getElementById('boardMatchSelect').value);
            if (match) { match.lines = [...canvasLines]; saveLocalData(); alert('保存しました。'); }
        }

        function openLogForMatch(id) {
            activeMatchId = id;
            const match = matches.find(m => m.id === id);
            if (!match) return;
            document.getElementById('logLeagueTag').textContent = match.league;
            document.getElementById('logTitle').textContent = `${match.home} vs ${match.away}`;
            document.getElementById('logSubtext').textContent = `${match.date} ${match.time}`;
            document.getElementById('logBuildUp').value = match.buildUp || '';
            document.getElementById('logDefensive').value = match.defensive || '';
            document.getElementById('logPlayers').value = match.players || '';
            document.getElementById('logSummary').value = match.summary || '';
            switchTab('logs');
        }

        function saveActiveMatchLog() {
            const match = matches.find(m => m.id === activeMatchId);
            if (match) {
                match.buildUp = document.getElementById('logBuildUp').value;
                match.defensive = document.getElementById('logDefensive').value;
                match.players = document.getElementById('logPlayers').value;
                match.summary = document.getElementById('logSummary').value;
                saveLocalData(); alert('考察を保存しました。');
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function handleNewMatchSubmit(e) {
            e.preventDefault();
            matches.unshift({
                id: 'm_' + Date.now(),
                home: document.getElementById('inputHome').value,
                away: document.getElementById('inputAway').value,
                date: document.getElementById('inputDate').value,
                time: document.getElementById('inputTime').value,
                league: document.getElementById('inputLeague').value,
                buildUp: '', defensive: '', players: '', summary: '', lines: []
            });
            saveLocalData(); renderMatches(); updateBoardMatchDropdown(); closeModal('newMatchModal');
        }
    </script>
</body>
</html>
