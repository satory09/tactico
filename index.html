<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactico — スコアゼロの欧州サッカー戦術ノート</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: {
                            base: '#0b1912',
                            line: '#1e4b35',
                            accent: '#10b981',
                            highlight: '#34d399',
                            dark: '#060d09'
                        },
                        slate: {
                            850: '#131b2e',
                            900: '#0f172a',
                            950: '#080d1a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080d1a;
            color: #f1f5f9;
        }
        .pitch-grid {
            background-image: linear-gradient(to right, rgba(30, 75, 53, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(30, 75, 53, 0.2) 1px, transparent 1px);
            background-size: 36px 36px;
        }
        .pitch-bg {
            background: radial-gradient(circle at center, #0e2319 0%, #060d09 100%);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #080d1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">

    <header class="h-16 border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md px-6 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-inner">
                <i class="fa-solid fa-chess-board text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-100 tracking-tight flex items-center gap-2 text-lg">
                    TACTICO
                    <span class="text-[10px] font-mono font-semibold tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase">
                        Zero Spoilers
                    </span>
                </h1>
                <p class="text-[11px] text-slate-400 font-mono hidden sm:block">結果のノイズを完全に遮断した、純粋な戦術観戦ノート</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex items-center gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
            <button id="navMatchesBtn" onclick="switchTab('matches')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 bg-emerald-500 text-slate-950 shadow-sm">
                <i class="fa-regular fa-calendar-days"></i> 試合カード
            </button>
            <button id="navBoardBtn" onclick="switchTab('board')" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all flex items-center gap-2">
                <i class="fa-solid fa-vector-square"></i> 戦術ピッチ
            </button>
            <button id="navLogsBtn" onclick="switchTab('logs')" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all flex items-center gap-2">
                <i class="fa-regular fa-file-lines"></i> 考察ログ
            </button>
        </nav>

        <!-- Quick Controls -->
        <div class="flex items-center gap-2">
            <button onclick="openModal('newMatchModal')" class="px-3.5 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-xs rounded-lg transition-all flex items-center gap-2 font-medium">
                <i class="fa-solid fa-plus"></i> 新規カード追加
            </button>
            <button onclick="exportAllNotebookData()" title="データ書き出し" class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded-lg transition-all text-xs">
                <i class="fa-solid fa-download"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">

        <!-- ==================== VIEW 1: MATCH FIXTURES LIST ==================== -->
        <section id="viewMatches" class="flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
            
            <!-- Filters Toolbar -->
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-b border-slate-800/80 pb-5">
                <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto">
                    <span class="text-xs font-mono text-slate-500 uppercase tracking-wider shrink-0">Filter:</span>
                    <button onclick="filterLeague('all')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 shrink-0">
                        すべて
                    </button>
                    <button onclick="filterLeague('Premier League')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Premier League
                    </button>
                    <button onclick="filterLeague('UCL')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        UEFA Champions League
                    </button>
                    <button onclick="filterLeague('La Liga')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        La Liga
                    </button>
                    <button onclick="filterLeague('Serie A')" class="league-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-900 text-slate-400 border border-slate-800 shrink-0">
                        Serie A
                    </button>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <div class="relative w-full sm:w-64">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-500"></i>
                        <input type="text" id="matchSearchInput" oninput="renderMatches()" placeholder="クラブ名・放送局で検索..." class="bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 w-full">
                    </div>
                </div>
            </div>

            <!-- Matches Cards Grid -->
            <div id="matchesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Injected dynamically via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="matchesEmpty" class="hidden flex-1 flex flex-col items-center justify-center text-center p-12 text-slate-500">
                <i class="fa-regular fa-futbol text-4xl mb-3 text-slate-700"></i>
                <p class="text-sm font-medium text-slate-400">試合カードがまだ登録されていません</p>
                <p class="text-xs text-slate-600 mt-1 max-w-sm">「新規カード追加」から対象の対戦カードを記録し、スコアを遮断した状態で戦術分析を始めましょう。</p>
            </div>
        </section>

        <!-- ==================== VIEW 2: TACTICAL PITCH BOARD ==================== -->
        <section id="viewBoard" class="hidden flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-950">
            
            <!-- Tactical Pitch Canvas Container -->
            <div class="flex-1 relative pitch-bg pitch-grid flex items-center justify-center p-4 overflow-hidden select-none">
                
                <!-- SVG Pitch Markings Layer -->
                <svg id="pitchMarkingsSvg" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] pointer-events-none" viewBox="0 0 800 500" preserveAspectRatio="none">
                    <!-- Outer Boundary -->
                    <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <!-- Halfway Line -->
                    <line x1="400" y1="20" x2="400" y2="480" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <!-- Center Circle & Spot -->
                    <circle cx="400" cy="250" r="65" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <circle cx="400" cy="250" r="3" fill="#1e4b35"/>
                    <!-- Left Penalty Box -->
                    <rect x="20" y="115" width="120" height="270" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <rect x="20" y="185" width="40" height="130" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <!-- Right Penalty Box -->
                    <rect x="660" y="115" width="120" height="270" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                    <rect x="740" y="185" width="40" height="130" fill="none" stroke="#1e4b35" stroke-width="2" opacity="0.9"/>
                </svg>

                <!-- Freehand Tactical Canvas Layer -->
                <canvas id="pitchCanvas" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] cursor-crosshair z-10"></canvas>

                <!-- Draggable Player Nodes Overlay Layer -->
                <div id="playersOverlay" class="absolute inset-4 w-[calc(100%-2rem)] h-[calc(100%-2rem)] z-20 pointer-events-none">
                    <!-- Player nodes rendered dynamically -->
                </div>

                <!-- Floating Canvas Drawing Toolbar -->
                <div class="absolute bottom-6 left-6 z-30 flex items-center gap-2 bg-slate-900/90 border border-slate-800 p-2 rounded-xl backdrop-blur-md shadow-2xl">
                    <button onclick="setDrawTool('arrow')" id="toolArrowBtn" class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-emerald-500 text-slate-950 shadow">
                        <i class="fa-solid fa-arrow-right"></i> 移動矢印
                    </button>
                    <button onclick="setDrawTool('pass')" id="toolPassBtn" class="px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                        <i class="fa-solid fa-ellipsis"></i> パス（点線）
                    </button>
                    <div class="w-px h-4 bg-slate-800 my-auto"></div>
                    <button onclick="clearCanvasLines()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition-all">
                        <i class="fa-solid fa-eraser"></i> 線を全消去
                    </button>
                </div>
            </div>

            <!-- Pitch Settings & Tactics Control Panel -->
            <div class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-slate-800 bg-slate-900/90 p-5 flex flex-col gap-5 shrink-0 overflow-y-auto">
                <div>
                    <span class="text-[10px] font-mono uppercase tracking-wider text-emerald-400">Board Setup</span>
                    <h2 class="text-sm font-semibold text-slate-200">フォーメーション & 作戦配置</h2>
                </div>

                <!-- Associated Match Select -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-400">対象の試合カードを選択</label>
                    <select id="boardMatchSelect" onchange="onBoardMatchSelectChange()" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                        <option value="">-- 単体ボードとして使用 --</option>
                    </select>
                </div>

                <!-- Team Display Selection -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-400">表示チーム配置</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="sideHomeBtn" onclick="setBoardTeamSide('home')" class="p-2 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-medium text-center">
                            HOME (左攻撃)
                        </button>
                        <button id="sideAwayBtn" onclick="setBoardTeamSide('away')" class="p-2 rounded-lg bg-slate-950 text-slate-400 border border-slate-800 text-xs font-medium text-center">
                            AWAY (右攻撃)
                        </button>
                    </div>
                </div>

                <!-- Formation Presets -->
                <div class="space-y-2">
                    <label class="text-xs font-medium text-slate-400">フォーメーション・プリセット</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyFormationPreset('4-3-3')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">4-3-3</button>
                        <button onclick="applyFormationPreset('4-2-3-1')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">4-2-3-1</button>
                        <button onclick="applyFormationPreset('3-4-2-1')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">3-4-2-1</button>
                        <button onclick="applyFormationPreset('3-5-2')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">3-5-2</button>
                        <button onclick="applyFormationPreset('4-4-2')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">4-4-2</button>
                        <button onclick="applyFormationPreset('5-4-1')" class="p-2 rounded-lg bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 font-mono text-center transition-all">5-4-1</button>
                    </div>
                </div>

                <!-- Save Action Button -->
                <div class="pt-4 border-t border-slate-800 flex flex-col gap-2">
                    <button onclick="saveCurrentBoardToMatch()" class="w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg text-xs transition-all shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> この配置・線を試合ログに保存
                    </button>
                </div>
            </div>
        </section>

        <!-- ==================== VIEW 3: OBSERVATION LOGS ==================== -->
        <section id="viewLogs" class="hidden flex-1 flex flex-col p-6 overflow-y-auto space-y-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                    <h2 class="text-base font-semibold text-slate-200">戦術考察・観戦ノート</h2>
                    <p class="text-xs text-slate-400">試合結果の数値（スコア）を出さず、ピッチ上の構造だけを記録します。</p>
                </div>
            </div>

            <!-- Active Match Observation Editor -->
            <div id="logEditor" class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
                <!-- Dynamic Header -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-800 pb-4 gap-2">
                    <div>
                        <span id="logLeagueTag" class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">対象カード未選択</span>
                        <h3 id="logTitle" class="text-xl font-bold text-slate-100 mt-1">カード一覧から対象の試合を選択してください</h3>
                        <p id="logSubtext" class="text-xs text-slate-500 font-mono">---</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportSingleLogToTxt()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs rounded-lg transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-file-export"></i> テキストで書き出し
                        </button>
                    </div>
                </div>

                <!-- Structured Tactical Input Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Build-up Section -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-shield-halved text-emerald-400"></i> ビルドアップ構造 & プレス回避
                        </label>
                        <textarea id="logBuildUp" rows="4" placeholder="（例）後方3-2でのビルドアップ。相手の第1ラインを超えられない場合のロングボールの出口や、サイドバックの絞り込み方など..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>

                    <!-- Defensive Block Section -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-chess-rook text-emerald-400"></i> 守備ブロック & 撤退・奪還構造
                        </label>
                        <textarea id="logDefensive" rows="4" placeholder="（例）ミドルブロック 4-4-2。サイドに追い込んでからのネガティブトランジション、ライン間のコンパクトさ..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>

                    <!-- Individual Tactical Roles -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-user-gear text-emerald-400"></i> キープレイヤーのタスク・個の役割
                        </label>
                        <textarea id="logPlayers" rows="4" placeholder="（例）インサイドハーフのハーフスペース突撃、ウイングのアイソレーション作成、アンカーの危機管理..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>

                    <!-- General Observations & Tactical Takeaways -->
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb text-emerald-400"></i> 総合戦術総括・学習ポイント
                        </label>
                        <textarea id="logSummary" rows="4" placeholder="この試合から得られた戦術的気づきや構造のまとめ..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 resize-none"></textarea>
                    </div>

                </div>

                <!-- Save Action -->
                <div class="flex justify-end border-t border-slate-800 pt-4">
                    <button onclick="saveActiveMatchLog()" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg text-xs transition-all shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-check"></i> 考察ログを保存
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL: Create New Match Fixture -->
    <div id="newMatchModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-plus text-emerald-400"></i> 試合カードの新規記録
                </h3>
                <button onclick="closeModal('newMatchModal')" class="text-slate-500 hover:text-slate-300 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="newMatchForm" onsubmit="handleNewMatchSubmit(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">ホームチーム</label>
                        <input type="text" id="inputHome" required placeholder="例: Arsenal" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                    </div>
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">アウェイチーム</label>
                        <input type="text" id="inputAway" required placeholder="例: Real Madrid" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">キックオフ日付</label>
                        <input type="date" id="inputDate" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                    </div>
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">時間</label>
                        <input type="time" id="inputTime" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">大会・リーグ</label>
                        <select id="inputLeague" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                            <option value="Premier League">Premier League</option>
                            <option value="UCL">UEFA Champions League</option>
                            <option value="La Liga">La Liga</option>
                            <option value="Serie A">Serie A</option>
                            <option value="Bundesliga">Bundesliga</option>
                            <option value="International">International</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-medium text-slate-400">放送局・配信プラットフォーム</label>
                        <input type="text" id="inputChannel" placeholder="例: SPOTV, U-NEXT, Abema" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50">
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">

        // --- Pitch Freehand Canvas Controls ---
        function initPitchCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            window.addEventListener('resize', resizePitchCanvas);

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', drawLinePreview);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
        }

        function resizePitchCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            const parent = canvas.parentElement;
            if (!parent) return;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            redrawCanvas();
        }

        function setDrawTool(tool) {
            currentDrawTool = tool;
            document.getElementById('toolArrowBtn').className = tool === 'arrow'
                ? "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-emerald-500 text-slate-950 shadow"
                : "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800";

            document.getElementById('toolPassBtn').className = tool === 'pass'
                ? "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 bg-emerald-500 text-slate-950 shadow"
                : "px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800";
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = e.target.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        }

        function drawLinePreview(e) {
            if (!isDrawing) return;
            const canvas = document.getElementById('pitchCanvas');
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const currX = e.clientX - rect.left;
            const currY = e.clientY - rect.top;

            redrawCanvas();

            ctx.beginPath();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2.5;

            if (currentDrawTool === 'pass') {
                ctx.setLineDash([6, 6]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.moveTo(startX, startY);
            ctx.lineTo(currX, currY);
            ctx.stroke();

            if (currentDrawTool === 'arrow') {
                drawArrowHead(ctx, startX, startY, currX, currY);
            }
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            const canvas = document.getElementById('pitchCanvas');
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            canvasLines.push({
                x1: startX,
                y1: startY,
                x2: endX,
                y2: endY,
                tool: currentDrawTool
            });

            redrawCanvas();
        }

        function drawArrowHead(ctx, fromX, fromY, toX, toY) {
            const headlen = 12;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.fillStyle = '#34d399';
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        function redrawCanvas() {
            const canvas = document.getElementById('pitchCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            canvasLines.forEach(line => {
                ctx.beginPath();
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 2.5;

                if (line.tool === 'pass') {
                    ctx.setLineDash([6, 6]);
                } else {
                    ctx.setLineDash([]);
                }

                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                ctx.stroke();

                if (line.tool === 'arrow') {
                    drawArrowHead(ctx, line.x1, line.y1, line.x2, line.y2);
                }
            });
        }

        function clearCanvasLines() {
            canvasLines = [];
            redrawCanvas();
        }
